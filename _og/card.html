<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0E0E0D;
    --bg-2: #161614;
    --ink: #F8F7F4;
    --ink-2: #C9C7C0;
    --ink-3: #8B8A83;
    --cyan: #22D3EE;
    --cyan-deep: #0891B2;
    --rule: #2A2A27;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 520px at 100% 0%, rgba(34, 211, 238, 0.16), transparent 60%),
      radial-gradient(600px 400px at 0% 100%, rgba(8, 145, 178, 0.10), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  /* Faint grid, echoing the site's engineering feel. */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.35;
    mask-image: radial-gradient(800px 500px at 85% 40%, black, transparent 75%);
  }
  .mark-bg { position: absolute; right: -290px; top: 50%; transform: translateY(-50%); width: 620px; height: 620px; opacity: 0.9; -webkit-mask-image: linear-gradient(to bottom, black 52%, transparent 80%); mask-image: linear-gradient(to bottom, black 52%, transparent 80%); }
  .wrap { position: relative; height: 100%; padding: 64px 72px 56px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 52px; height: 52px; }
  .brand .name { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
  .badge {
    margin-left: 18px; padding: 7px 14px; border: 1px solid rgba(34, 211, 238, 0.35); border-radius: 999px;
    color: var(--cyan); font-size: 17px; font-weight: 500; background: rgba(34, 211, 238, 0.06);
  }
  h1 {
    margin-top: 58px; font-size: 74px; line-height: 1.04; font-weight: 700; letter-spacing: -0.025em; max-width: 800px;
  }
  h1 .accent { color: var(--cyan); }
  .sub { margin-top: 26px; font-size: 27px; line-height: 1.4; color: var(--ink-2); max-width: 680px; }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 22px; }
  .surfaces { display: flex; gap: 10px; }
  .chip { font-family: "IBM Plex Mono", monospace; font-size: 17px; font-weight: 500; color: var(--ink-2); padding: 6px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg-2); }
  .url { font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: 0.01em; }
  .url span { color: var(--cyan); }
</style>
</head>
<body>
  <!-- Large brand mark, same geometry as the site logo, scaled up as decoration. -->
  <svg class="mark-bg" viewBox="0 0 20 20" aria-hidden="true">
    <polygon points="10,0.5 18.7,5.25 18.7,14.75 10,19.5 1.3,14.75 1.3,5.25" fill="none" stroke="#22D3EE" stroke-width="0.12" opacity="0.35"/>
    <g stroke="#22D3EE" stroke-width="0.07" opacity="0.18">
      <line x1="10" y1="10" x2="10" y2="0.5"/><line x1="10" y1="10" x2="18.7" y2="5.25"/>
      <line x1="10" y1="10" x2="18.7" y2="14.75"/><line x1="10" y1="10" x2="10" y2="19.5"/>
      <line x1="10" y1="10" x2="1.3" y2="14.75"/><line x1="10" y1="10" x2="1.3" y2="5.25"/>
    </g>
    <g fill="#22D3EE" opacity="0.5">
      <circle cx="10" cy="0.5" r="0.22"/><circle cx="18.7" cy="5.25" r="0.22"/><circle cx="18.7" cy="14.75" r="0.22"/>
      <circle cx="10" cy="19.5" r="0.22"/><circle cx="1.3" cy="14.75" r="0.22"/><circle cx="1.3" cy="5.25" r="0.22"/>
    </g>
    <path d="M10,3 L10.7,8.2 L15.4,5.9 L11.5,10 L15.4,14.1 L10.7,11.8 L10,17 L9.3,11.8 L4.6,14.1 L8.5,10 L4.6,5.9 L9.3,8.2 Z" fill="#22D3EE" opacity="0.13"/>
  </svg>

  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <polygon points="10,0.5 18.7,5.25 18.7,14.75 10,19.5 1.3,14.75 1.3,5.25" fill="none" stroke="#22D3EE" stroke-width="0.6" opacity="0.55"/>
        <path d="M10,3 L10.7,8.2 L15.4,5.9 L11.5,10 L15.4,14.1 L10.7,11.8 L10,17 L9.3,11.8 L4.6,14.1 L8.5,10 L4.6,5.9 L9.3,8.2 Z" fill="#22D3EE"/>
        <circle cx="10" cy="10" r="1.1" fill="#0E0E0D"/><circle cx="10" cy="10" r="0.55" fill="#22D3EE"/>
      </svg>
      <div class="name">KubeAstra</div>
      <div class="badge">Apache 2.0 · Open source</div>
    </div>

    <h1>Your Kubernetes cluster has an <span class="accent">AI&nbsp;debugger</span> now.</h1>
    <p class="sub">Finds the root cause of broken pods, shows its evidence, and proposes fixes you approve.</p>

    <div class="foot">
      <div class="surfaces">
        <span class="chip">macOS app</span>
        <span class="chip">VS Code</span>
        <span class="chip">Web UI</span>
        <span class="chip">CLI</span>
        <span class="chip">Helm</span>
      </div>
      <div class="url">kubeastra<span>.io</span></div>
    </div>
  </div>
</body>
</html>
